[package]
name = "bifrost"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline machine command execution framework over shared storage (GPFS) with MCP server support"
repository = "https://github.com/peterlau123/bifrost"

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"

# File system
notify = "5.0"
fs2 = "0.4"

# CLI
clap = { version = "4.0", features = ["derive"] }
serde_yaml = "0.9"
humantime = "2.1"
shell-words = "1.0"
ctrlc = "3.4"
libc = "0.2"
rmcp = { version = "3.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2"

# TODO: SQLite integration (task history persistence)

[[bin]]
name = "bifrost"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.0"
