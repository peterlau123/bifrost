[package]
name = "bifrost"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline machine command execution framework over shared storage (GPFS) or SSH, with MCP server support"
repository = "https://github.com/peterlau123/bifrost"

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"

# File system
notify = "5.0"
fs2 = "0.4"

# CLI
clap = { version = "4.0", features = ["derive"] }
serde_yaml = "0.9"
humantime = "2.1"
shell-words = "1.0"
ctrlc = "3.4"
libc = "0.2"
rmcp = { version = "3.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2"

# TODO: SQLite integration (task history persistence)

[[bin]]
name = "bifrost"
path = "src/main.rs"

# 集成测试：cargo 只会自动发现 tests/*.rs，不会递归 tests/unit、tests/integration，
# 所以这里必须显式声明，否则这些文件永远不会被编译（历史坑：77 个用例静默失效过）
[[test]]
name = "batch_tracker_test"
path = "tests/unit/batch_tracker_test.rs"

[[test]]
name = "core_models_test"
path = "tests/unit/core_models_test.rs"

[[test]]
name = "coverage_boost_test"
path = "tests/unit/coverage_boost_test.rs"

[[test]]
name = "executor_test"
path = "tests/unit/executor_test.rs"

[[test]]
name = "gpu_scheduler_test"
path = "tests/unit/gpu_scheduler_test.rs"

[[test]]
name = "gpu_task_processor_test"
path = "tests/unit/gpu_task_processor_test.rs"

[[test]]
name = "protocol_test"
path = "tests/unit/protocol_test.rs"

[[test]]
name = "task_manifest_test"
path = "tests/unit/task_manifest_test.rs"

[[test]]
name = "watcher_test"
path = "tests/unit/watcher_test.rs"

[[test]]
name = "batch_gpu_workflow_test"
path = "tests/integration/batch_gpu_workflow_test.rs"

[[test]]
name = "full_workflow_test"
path = "tests/integration/full_workflow_test.rs"

[dev-dependencies]
tempfile = "3.0"
