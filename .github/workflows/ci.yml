name: CI

# 质量门禁：fmt / clippy / test → e2e
#
# 触发：
#   - 所有 feature 分支的 push（main / release/** 由 release.yml 统一跑一遍，避免重复）
#   - 所有 pull_request
#   - release.yml 通过 workflow_call 复用同一套门禁
#
# 构建逻辑不写在这里，统一走 scripts/ci/*.sh（与本地、Gitee 共用同一份实现）：
#   scripts/ci/gates.sh      环境诊断 → 工具链 → fmt → clippy → cargo test --all
#   scripts/ci/e2e-stage.sh  工具链 → release 构建 → tests/e2e/run_all.py 的 6 个场景

on:
  push:
    branches-ignore:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: gates (fmt / clippy / test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run gates
        run: bash scripts/ci/gates.sh

  e2e:
    name: e2e (release build + 6 scenarios)
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run e2e
        run: bash scripts/ci/e2e-stage.sh
