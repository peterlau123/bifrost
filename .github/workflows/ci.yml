name: CI

# ⚠️ 本文件只对 GitHub 镜像 (peterlau123/bifrost) 有效，而镜像自 2026-08-25 起未再同步
#    （落后 Gitee main ~200 个提交），所以这份 workflow 目前是**不跑的**。
#    CI 的权威在 Gitee Go：.workflow/release.yml（gates → e2e → dist 双通道）。
#    保留此文件仅为将来恢复双向同步时使用；若确定不再镜像到 GitHub，可直接删除。

on:
  push:
    branches: [main, master, test/deploy]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. 静态检查 + 单元测试
  check-and-test:
    name: fmt / clippy / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (static analysis)
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

  # 2. 端到端测试 (release 构建 + 全部 e2e 场景)
  e2e:
    name: e2e tests (timeout / job / concurrent / robustness / mcp)
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Run e2e test suite
        run: python3 tests/e2e/run_all.py ./target/release/bifrost
