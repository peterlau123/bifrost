# Gitee Go 流水线：门禁（fmt/clippy/test）→ e2e → 按分支双通道打包发布
#
# 通道规则（分支即通道，脚本里还有二次校验）：
#   main           → 快照通道：只出 bifrost-latest-x86_64-linux-musl.tar.gz + .sha256（流水线制品）
#                    不打 tag、不发 Release
#   release/x.y.z  → 正式通道：Cargo.toml 版本必须 == x.y.z → tag v<x.y.z> → Gitee Release（tar.gz + .deb + sha256）
#   其它分支        → 不触发；脚本本身也会拒绝（防止本机误发版）
#
# 开启方式（一次性）：
#   1. 仓库页 → 流水线（Gitee Go）→ 新建流水线 → 选择「导入 .workflow 配置」
#   2. 流水线「参数设置」里新增加密变量 GITEE_TOKEN
#      （Gitee → 设置 → 私人令牌，勾 projects 权限；只用来建 tag/Release/传附件）
#   3. 删掉仓库里自动生成的那条「流水线-202610221113.yml」（1.69 + 部署到主机组，不是我们要的）
#
# 说明：
#   - 本文件放在仓库里就等于"流水线即代码"：改构建逻辑改脚本，不点页面
#   - rustVersion 用 1.69 是因为 Gitee 自带模板给的就是这个（保证该值在插件里可选）；
#     真正的工具链版本由 scripts/ci/toolchain.sh 探测并升级到 >= 1.80
#   - 不配 deploy@agent：发布目标是 Gitee Release，不是自有主机
#   - 分支条件用的是 precise + prefix；若页面导入后 release/* 不触发，改成
#     include: ['release/*'] 或直接在页面上用「手动触发」跑正式通道

version: "1.0"
name: bifrost-release
displayName: 门禁 / e2e / 快照与正式发布

triggers:
  push:
    branches:
      precise:
        - main
      prefix:
        - release/

stages:
  # ── 1. 质量门禁：一个挂了就不往下走 ──────────────────────────
  - name: gates
    displayName: 质量门禁
    strategy: fast
    trigger: auto
    steps:
      - step: build@rust
        name: gates
        displayName: fmt / clippy / test
        rustVersion: "1.69"
        commands:
          # 全部逻辑在 gates.sh 里（同一个 shell）：env 诊断 → 工具链升级 → fmt → clippy → test
          # 插件自带的 1.69 读不了 Cargo.lock v4，必须在该脚本内升级并硬校验
          - bash scripts/ci/gates.sh
        strategy:
          retry: "0"
          resource:
            cpu: "4"
            memory: "8"

  # ── 2. 端到端：真跑一遍 client→daemon→结果 的全链路 ──────────
  - name: e2e
    displayName: 端到端测试
    strategy: naturally
    trigger: auto
    steps:
      - step: build@rust
        name: e2e
        displayName: release 构建 + 6 个 e2e 场景
        rustVersion: "1.69"
        commands:
          # 同一个 shell 里：工具链 → release 构建 → 6 个 e2e 场景（含 python 解释器自检）
          - bash scripts/ci/e2e-stage.sh
        strategy:
          retry: "0"
          resource:
            cpu: "4"
            memory: "8"

  # ── 3. 打包与发布：main 出快照，release/x.y.z 出正式版 ────────
  - name: release
    displayName: 打包与发布
    strategy: naturally
    trigger: auto
    steps:
      - step: build@rust
        name: release
        displayName: 按分支通道打包（main=latest 快照 / release=正式 Release）
        rustVersion: "1.69"
        commands:
          # 同一个 shell 里：工具链（必须！插件自带 1.69 读不了 lock v4）→ release.sh
          #   main          → pack.sh --label latest --no-deb，不发正式版本
          #   release/x.y.z → 校验版本一致 → tag v<版本> → Release
          - bash scripts/ci/dist-stage.sh
        artifacts:
          - name: DIST
            path:
              - ./dist
            type: .tar.gz
        strategy:
          retry: "0"
          resource:
            cpu: "4"
            memory: "8"

notify: []
strategy:
  blocking: true
